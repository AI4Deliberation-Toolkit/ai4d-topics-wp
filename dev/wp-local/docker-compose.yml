# Dev only: a throwaway local WordPress for the gateway-mode smoke test
# (Task 7 of the gateway-mode plan: local WordPress against the gateway pod).
# Not shipped: scripts/build-zip.sh doesn't copy dev/. Not the test suite
# (that is ../../docker-compose.yml).
#
#   docker compose up -d db wordpress            # http://localhost:8080
#   docker compose run --rm cli wp core version  # WP-CLI, sees ../../build at /build
#   docker compose down -v                       # tear down, volumes too

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    ports:
      - "8080:80"
    environment: &wp-db-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wp:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  cli:
    image: wordpress:cli
    profiles: [cli]
    user: "33:33"
    environment: *wp-db-env
    volumes:
      - wp:/var/www/html
      - ../../build:/build:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  wp:
